<div class="login-container">
    <!-- VISUAL SIDE -->
    <div class="login-visual">
        <div class="visual-content">
            <h2>Elevate your property portfolio.</h2>
            <p>Access your dashboard to monitor performance, manage tenants, and optimize your investments with precision.</p>
        </div>
    </div>

    <!-- FORM SIDE -->
    <div class="login-form-wrapper">
        <div class="brand">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <span class="brand-name">GeoProp</span>
        </div>

        <div class="form-header">
            <h1>Welcome back</h1>
            <p>Please enter your details to sign in.</p>
        </div>

        <form (submit)="login(); $event.preventDefault()">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="Enter your email" required value="alex.jensen@geoprop.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required value="password123">
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">
                Sign in
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>

        <p class="signup-prompt">
            Don't have an account? <a href="#">Sign up</a>
        </p>
    </div>
</div>
